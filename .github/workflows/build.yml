name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces the run before it. A run on main is
# never cancelled, since each commit there gets a group of its own. Sharing one
# group on main would let a third push drop the run still waiting behind the
# first, which is how a release commit loses its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # CORE tier, fast and small closures. Runs on every PR/push/dispatch. It
  # proves a functioning host builds and that the impermanence (persistence)
  # invariant holds, plus lint + docs.
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Reclaim disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          # Retry flaky substitutions, then fall back to building from source.
          extra-conf: |
            fallback = true
            download-attempts = 10
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: othrys-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community, hyprland
          pushFilter: '(-source$|-man$|\.tar\.gz$|\.xz$)'
          skipPush: ${{ github.ref != 'refs/heads/main' }}
        continue-on-error: true
      - name: Build core checks
        run: |
          nix build --no-link --print-build-logs \
            '.#checks.x86_64-linux.pre-commit-check' \
            '.#checks.x86_64-linux.secret-scan' \
            '.#checks.x86_64-linux.docs' \
            '.#checks.x86_64-linux.docs-includes' \
            '.#checks.x86_64-linux.eval-host-min' \
            '.#checks.x86_64-linux.eval-host-headless' \
            '.#checks.x86_64-linux.eval-host-server' \
            '.#checks.x86_64-linux.eval-host-anonymous' \
            '.#checks.x86_64-linux.eval-host-server-account' \
            '.#checks.x86_64-linux.eval-host-app-no-hm' \
            '.#checks.x86_64-linux.eval-host-app-no-hm-full' \
            '.#checks.x86_64-linux.eval-host-app-no-hm-noctalia' \
            '.#checks.x86_64-linux.eval-pairs' \
            '.#checks.x86_64-linux.eval-contract' \
            '.#checks.x86_64-linux.ci-coverage' \
            '.#checks.x86_64-linux.eval-bootloader' \
            '.#checks.x86_64-linux.eval-nvidia' \
            '.#checks.x86_64-linux.eval-hardware' \
            '.#checks.x86_64-linux.eval-rustdesk' \
            '.#checks.x86_64-linux.eval-dev-shells' \
            '.#checks.x86_64-linux.eval-router-services' \
            '.#checks.x86_64-linux.eval-router' \
            '.#checks.x86_64-linux.eval-headscale' \
            '.#checks.x86_64-linux.eval-tailscale' \
            '.#checks.x86_64-linux.eval-exposure' \
            '.#checks.x86_64-linux.eval-claude-code' \
            '.#checks.x86_64-linux.eval-k3s' \
            '.#checks.x86_64-linux.eval-pam' \
            '.#checks.x86_64-linux.eval-containers' \
            '.#checks.x86_64-linux.eval-nix' \
            '.#checks.x86_64-linux.eval-grafana' \
            '.#checks.x86_64-linux.eval-listen' \
            '.#checks.x86_64-linux.eval-shell' \
            '.#checks.x86_64-linux.eval-floorp' \
            '.#checks.x86_64-linux.eval-languages' \
            '.#checks.x86_64-linux.eval-services' \
            '.#checks.x86_64-linux.eval-auto-upgrade' \
            '.#checks.x86_64-linux.eval-types' \
            '.#checks.x86_64-linux.eval-template' \
            '.#checks.x86_64-linux.eval-exports' \
            '.#checks.x86_64-linux.eval-ssh' \
            '.#checks.x86_64-linux.eval-ssh-settings' \
            '.#checks.x86_64-linux.eval-traefik' \
            '.#checks.x86_64-linux.eval-host-hardening' \
            '.#checks.x86_64-linux.eval-host-hardening-hibernate' \
            '.#checks.x86_64-linux.eval-impermanence' \
            '.#checks.x86_64-linux.eval-persistence' \
            '.#checks.x86_64-linux.eval-service-state' \
            '.#checks.x86_64-linux.eval-lock' \
            '.#checks.x86_64-linux.eval-login' \
            '.#checks.x86_64-linux.eval-desktop' \
            '.#checks.x86_64-linux.impermanence-test'
  # The portable host evaluations on a native ARM runner. It shows that the
  # module tree evaluates for aarch64-linux and nothing more. No VM test runs
  # here, and nothing is booted. The list is portableChecks in flake/checks.
  core-aarch64:
    name: Core checks (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          extra-conf: |
            fallback = true
            download-attempts = 10
      - name: Build the portable checks
        run: |
          nix build --no-link --print-build-logs \
            '.#checks.aarch64-linux.eval-host-min' \
            '.#checks.aarch64-linux.eval-host-headless' \
            '.#checks.aarch64-linux.eval-host-server' \
            '.#checks.aarch64-linux.eval-host-anonymous' \
            '.#checks.aarch64-linux.eval-host-server-account' \
            '.#checks.aarch64-linux.eval-default' \
            '.#checks.aarch64-linux.eval-host-hardening' \
            '.#checks.aarch64-linux.eval-host-hardening-hibernate' \
            '.#checks.aarch64-linux.eval-bootloader' \
            '.#checks.aarch64-linux.eval-traefik' \
            '.#checks.aarch64-linux.eval-ssh' \
            '.#checks.aarch64-linux.eval-dev-shells'
  # EXTENDED tier, heavy (full-tree eval + enable matrix + runtime VM tests).
  # Runs on every pull request, every push to main and manual dispatch, so a
  # pull request reports the whole suite before it can land. Nothing in the
  # event decides whether it runs, neither the changed paths nor the title.
  # Run locally any time with `nix flake check` (which builds every check
  # regardless of tier).
  extended:
    name: Extended checks
    runs-on: ubuntu-latest
    # One runner per check: each gets a whole machine, one failure re-runs alone.
    strategy:
      fail-fast: false
      matrix:
        check:
          - eval-default
          - eval-host-desktop
          - eval-host-desktop-niri
          - eval-ashell
          - enable-matrix
          - restic-test
          - headscale-test
          - auto-upgrade-test
          - crowdsec-test
          - router-test
          - router-ips-test
          - integration-test
          - listeners-test
          - impermanence-reboot-test
          - impermanence-wipe-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Reclaim disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: Grow swap to 8G
        run: |
          # The runner image already runs swap on /swapfile; replace it.
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          # Retry flaky substitutions, then fall back to building from source.
          extra-conf: |
            fallback = true
            download-attempts = 10
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: othrys-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community, hyprland
          pushFilter: '(-source$|-man$|\.tar\.gz$|\.xz$)'
          skipPush: ${{ github.ref != 'refs/heads/main' }}
        continue-on-error: true
      - name: Build ${{ matrix.check }}
        run: |
          nix build --no-link --print-build-logs \
            '.#checks.x86_64-linux.${{ matrix.check }}'
  # Single status for branch protection, which cannot require a matrix by
  # name. It runs whatever the matrix did and passes on `success` alone, so a
  # failed, cancelled or skipped tier fails the verdict.
  extended-ok:
    name: Extended verdict
    runs-on: ubuntu-latest
    needs: extended
    if: ${{ always() }}
    steps:
      - name: Verdict
        env:
          RESULT: ${{ needs.extended.result }}
        run: |
          [ "$RESULT" = "success" ] || {
            echo "extended matrix result: $RESULT"
            exit 1
          }
