name: CodeQL
# Static analysis for security weaknesses in the code that is not Nix. The
# `actions` analysis reads the workflows under .github/workflows for script
# injection through event fields, unpinned actions and excess token
# permissions. The `python` analysis reads the scripts under flake/checks, among
# them agent-hook.py, which runs before every write and shell command in an
# agent session. Nix has no CodeQL extractor, and statix, deadnix and gitleaks
# cover it in build.yml.
#
# Neither language is compiled, so both run with `build-mode: none` and the
# job installs nothing. Results go to code scanning under the Security tab and
# show on each pull request. The repository's default code scanning setup is
# off, since it and this workflow cannot both upload for the same language.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
