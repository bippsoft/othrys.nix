name: Flake Inputs
on:
  push:
    branches: [main]
    paths: [flake.lock, flake.nix]
  pull_request:
    paths: [flake.lock, flake.nix]
  # flake-checker validates the health of the nixpkgs pins themselves, meaning
  # the branch they track, how far behind they are, and whether the release is
  # still supported. It does not scan for security advisories, and nothing in
  # this pipeline does. The weekly run exists because a pin that has not
  # changed still ages out of support on its own.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  flake-inputs:
    name: Check Flake Inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
