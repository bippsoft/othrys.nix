name: Scorecard
# OpenSSF Scorecard. Scores the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases and the rest)
# and publishes the result, which is what the README badge reads. The SARIF
# upload puts the individual findings under the Security tab.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published result, which publish_results requires.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
