name: Update Inputs
# Weekly `nix flake update` as a PR. It is opened and tested, never merged. An
# input bump reaches main only when someone reads it, which is the point of
# raising it as a PR rather than pushing the lockfile.
#
# build.yml runs both check tiers on the PR as it does on any other, which
# matters here since input bumps are exactly the changes that break deep
# surfaces. The "chore(flake)" title is the commit convention and selects
# nothing.
#
# The commit is unsigned, since no key that signs for main is given to a
# workflow. build.yml skips its signature job for this branch, and the
# maintainer who lands the bump signs it.
#
# TOKEN. This needs a token other than the default GITHUB_TOKEN, supplied as the
# FLAKE_UPDATE_TOKEN secret. Two separate GitHub behaviours make the default
# token insufficient:
#
#  1. Creating a PR at all requires "Allow GitHub Actions to create and approve
#     pull requests" in the repository settings. Without it the run fails with
#     "GitHub Actions is not permitted to create or approve pull requests", which
#     is how this workflow failed every week since the schedule started.
#  2. More importantly, events raised by GITHUB_TOKEN do not start new workflow
#     runs. A PR it opens therefore never fires build.yml, so `Core checks` and
#     `Extended verdict` never report, and since both are required by branch
#     protection the PR can never merge. A bump that arrives with nothing run
#     against it is the outcome to avoid.
#
# A PAT or GitHub App token raises events normally, so the checks attach on open.
# The secret should be a fine-grained personal access token restricted to this
# repository, with read and write on "Contents" and "Pull requests" and nothing
# else. It is bound to the one step that opens the PR, so checkout and the Nix
# install never see it. Checkout does not persist the default token either, and
# the step that opens the PR pushes with the token it is given.
# The workflow falls back to GITHUB_TOKEN when the secret is absent so the update
# still happens, and the guard below says plainly that the PR arrived untested.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    # The fallback GITHUB_TOKEN needs both to push the branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    env:
      # Resolved here rather than in the step below, since the `secrets` context
      # is not available in a step-level `if` and the guard would silently never
      # fire if it read the secret directly.
      HAS_DEDICATED_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
      - name: Update flake.lock and open PR
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-msg: "chore(flake): update inputs"
          pr-title: "chore(flake): update inputs"
          pr-labels: |
            automated
            dependencies
      # Says so once, on the run that produced the PR, rather than leaving
      # someone to work out why a PR has no checks against it.
      - name: Warn when running without a dedicated token
        if: steps.update.outputs.pull-request-number != '' && env.HAS_DEDICATED_TOKEN != 'true'
        run: |
          {
            echo "### This PR has no checks attached"
            echo
            echo "It was opened with the default \`GITHUB_TOKEN\`, and events raised"
            echo "by that token do not start workflow runs. \`build.yml\` has not"
            echo "fired, so \`Core checks\` and \`Extended verdict\` will never report."
            echo "Branch protection requires both, so the PR cannot merge as it is."
            echo
            echo "Close and reopen the PR to attach a run, or add a"
            echo "\`FLAKE_UPDATE_TOKEN\` secret so future updates arrive tested."
          } >> "$GITHUB_STEP_SUMMARY"
